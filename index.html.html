<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>제4기 세전포럼 · 분야별 우수사례 투표</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --ink:#16203a;
    --ink-soft:#4a5677;
    --paper:#f6f4ee;
    --card:#ffffff;
    --line:#e4e0d6;
    --accent:#1f6feb;
    --accent-soft:#e8f0fe;
    --gold:#c8932a;
    --silver:#8a93a6;
    --bronze:#b08550;
    --green:#0d9488;
    --f0:#2563eb; --f1:#0d9488; --f2:#9333ea; --f3:#dc2626; --f4:#ea580c;
    --hero-a:#0d2b3e; --hero-b:#0f5c5e; --hero-gold:#c9a24b;
  }
  .hero{
    background:linear-gradient(135deg,var(--hero-a),var(--hero-b) 70%);
    border-radius:18px;padding:22px 20px 20px;color:#fff;position:relative;overflow:hidden;
    margin-bottom:18px;
  }
  .hero-badge{
    display:flex;align-items:center;gap:8px;margin-bottom:14px;
  }
  .hero-logo{
    width:30px;height:30px;background:#fff;border-radius:50%;
    display:flex;align-items:center;justify-content:center;padding:4px;flex-shrink:0;
    box-shadow:0 2px 6px rgba(0,0,0,.25);
  }
  .hero-logo img{width:100%;height:100%;object-fit:contain;}
  .hero-org{font-size:12px;font-weight:700;letter-spacing:.06em;color:#dfeceb;}
  .hero-title{font-size:19px;font-weight:800;line-height:1.35;letter-spacing:-.01em;}
  .hero-sub{font-size:12.5px;color:#bcd8d6;margin-top:5px;font-weight:600;}
  .hero-info{
    margin-top:16px;display:flex;flex-direction:column;gap:8px;
    background:rgba(255,255,255,0.08);border-radius:12px;padding:12px 14px;
    border:1px solid rgba(255,255,255,0.12);
  }
  .hero-row{display:flex;align-items:baseline;gap:8px;font-size:12.5px;}
  .hero-row-label{color:var(--hero-gold);font-weight:700;flex-shrink:0;width:34px;}
  .hero-row-val{color:#eef6f5;font-weight:600;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--paper);}
  body{
    font-family:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    color:var(--ink);line-height:1.55;
    max-width:560px;margin:0 auto;padding-bottom:100px;
    -webkit-font-smoothing:antialiased;
  }
  header{
    padding:24px 20px 18px;border-bottom:1px solid var(--line);
    background:var(--card);position:sticky;top:0;z-index:20;
  }
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--accent);text-transform:uppercase;}
  h1{font-size:20px;font-weight:800;margin-top:6px;letter-spacing:-.02em;}
  .sub{font-size:12.5px;color:var(--ink-soft);margin-top:6px;}
  .backrow{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
  .backbtn{
    font-size:12.5px;font-weight:700;color:var(--ink-soft);background:none;border:none;
    cursor:pointer;padding:4px 0;font-family:inherit;
  }

  .wrap{padding:18px 16px 0;}

  /* ---------- Home: field picker ---------- */
  .field-grid{display:flex;flex-direction:column;gap:10px;margin-top:4px;}
  .field-card{
    display:flex;align-items:center;gap:14px;
    background:var(--card);border:1.5px solid var(--line);border-radius:16px;
    padding:18px 16px;cursor:pointer;text-align:left;
  }
  .field-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
  .field-main{flex:1;}
  .field-name{font-size:15.5px;font-weight:800;}
  .field-meta{font-size:12px;color:var(--ink-soft);margin-top:3px;}
  .field-arrow{color:var(--ink-soft);font-size:18px;}

  .admin-entry{
    margin-top:22px;text-align:center;
  }
  .admin-link{
    font-size:12.5px;color:var(--ink-soft);text-decoration:underline;background:none;border:none;
    cursor:pointer;font-family:inherit;padding:8px;
  }

  /* ---------- Auth card ---------- */
  .auth-card{
    background:var(--card);border:1.5px solid var(--line);border-radius:16px;
    padding:22px 20px;margin-top:6px;
  }
  .auth-title{font-size:16px;font-weight:800;margin-bottom:4px;}
  .auth-desc{font-size:12.5px;color:var(--ink-soft);margin-bottom:18px;line-height:1.6;}
  .auth-field{margin-bottom:14px;}
  .auth-label{font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:6px;display:block;}
  .auth-select,.auth-input{
    width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;
    font-size:15px;font-family:inherit;background:#fff;color:var(--ink);
  }
  .auth-select:focus,.auth-input:focus{outline:none;border-color:var(--accent);}
  .auth-btn{
    width:100%;padding:14px;border:none;border-radius:11px;background:var(--ink);color:#fff;
    font-size:15.5px;font-weight:800;cursor:pointer;font-family:inherit;margin-top:6px;
  }
  .auth-btn:disabled{background:#c7c2b6;}
  .auth-note{font-size:11.5px;color:var(--ink-soft);text-align:center;margin-top:14px;line-height:1.6;}
  .auth-err{font-size:12.5px;color:#dc2626;font-weight:700;margin-top:8px;display:none;}

  .who-bar{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--accent-soft);border:1px solid #c9ddfb;border-radius:12px;
    padding:11px 14px;margin:14px 16px 0;font-size:13px;
  }
  .who-name{font-weight:800;color:var(--ink);}
  .who-logout{font-size:12px;color:var(--accent);font-weight:700;background:none;border:none;cursor:pointer;font-family:inherit;}

  /* ---------- Candidate cards ---------- */
  .cand-list{display:flex;flex-direction:column;gap:12px;margin-top:14px;}
  .cand-card{
    display:flex;gap:14px;background:var(--card);border:2px solid var(--line);border-radius:16px;
    padding:14px;cursor:pointer;position:relative;
  }
  .cand-card.sel{border-color:var(--accent);background:var(--accent-soft);}
  .cand-photo{
    width:64px;height:64px;border-radius:12px;object-fit:cover;flex-shrink:0;background:#e4e0d6;
  }
  .cand-main{flex:1;min-width:0;}
  .cand-name{font-size:14.5px;font-weight:800;}
  .cand-gen{font-size:11.5px;color:var(--ink-soft);font-weight:600;margin-left:4px;}
  .cand-topic{font-size:12.5px;color:var(--ink-soft);margin-top:4px;line-height:1.5;}
  .cand-check{
    width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;margin-top:2px;
  }
  .cand-card.sel .cand-check{background:var(--accent);border-color:var(--accent);}
  .cand-check svg{display:none;width:13px;height:13px;}
  .cand-card.sel .cand-check svg{display:block;}

  .fixed-bar{
    position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    max-width:560px;margin:0 auto;
  }
  .btn{
    width:100%;padding:15px;border:none;border-radius:12px;background:var(--ink);color:#fff;
    font-size:15.5px;font-weight:800;cursor:pointer;font-family:inherit;
  }
  .btn:disabled{background:#c7c2b6;}

  /* ---------- Done screen ---------- */
  .done-wrap{text-align:center;padding:60px 24px;}
  .done-icon{font-size:52px;margin-bottom:16px;}
  .done-title{font-size:19px;font-weight:800;margin-bottom:8px;}
  .done-desc{font-size:13.5px;color:var(--ink-soft);line-height:1.7;}
  .done-btn{
    margin-top:26px;padding:13px 26px;border:1.5px solid var(--line);border-radius:11px;
    background:var(--card);color:var(--ink);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;
  }

  /* ---------- Admin ---------- */
  .rank-list{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
  .rank-card{
    display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);
    border-radius:14px;padding:12px 14px;
  }
  .rank-card.r1{border-color:var(--gold);background:#fdf6e8;}
  .rank-card.r2{border-color:var(--silver);background:#f4f5f7;}
  .rank-card.r3{border-color:var(--bronze);background:#f9f0e6;}
  .rank-num{
    width:30px;height:30px;border-radius:50%;background:var(--paper);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0;
  }
  .r1 .rank-num{background:var(--gold);color:#fff;}
  .r2 .rank-num{background:var(--silver);color:#fff;}
  .r3 .rank-num{background:var(--bronze);color:#fff;}
  .rank-photo{width:44px;height:44px;border-radius:10px;object-fit:cover;flex-shrink:0;background:#e4e0d6;}
  .rank-main{flex:1;min-width:0;}
  .rank-name{font-size:13.5px;font-weight:800;}
  .rank-topic{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .rank-votes{font-size:15px;font-weight:800;color:var(--accent);flex-shrink:0;}
  .office-section{margin-top:20px;}
  .office-section:first-child{margin-top:6px;}
  .office-field-head{
    display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:0 2px;
  }
  .office-field-name{font-size:14px;font-weight:800;}
  .office-field-meta{font-size:11.5px;color:var(--ink-soft);margin-left:auto;font-weight:600;}
  .rank-summary{
    display:flex;justify-content:space-between;background:var(--accent-soft);border-radius:12px;
    padding:12px 14px;margin-top:14px;font-size:12.5px;color:var(--ink-soft);font-weight:600;
  }

  .toast{
    position:fixed;left:50%;bottom:100px;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:700;
    opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:99;white-space:nowrap;
  }
  .toast.show{opacity:1;}

  .spinner{
    width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;
    animation:spin .7s linear infinite;margin:40px auto;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>

const firebaseConfig = {

  messagingSenderId: "541200335203",
  appId: "1:541200335203:web:c828ac49b13464a6d25356",
};
const fbApp = initializeApp(firebaseConfig, "topicVoteApp2026");
const db = getFirestore(fbApp);
const VOTE_COLLECTION = "forum4_topic_votes"; // 이 투표 전용 컬렉션 (기존 자기소개 투표와 분리됨)

window.fbSetVote = async function(docId, value){
  await setDoc(doc(db, VOTE_COLLECTION, docId), { value, updatedAt: Date.now() });
};
window.fbGetVote = async function(docId){
  const snap = await getDoc(doc(db, VOTE_COLLECTION, docId));
  return snap.exists() ? snap.data().value : null;
};
window.fbGetAllVotesForField = async function(fieldSlug){
  const snaps = await getDocs(collection(db, VOTE_COLLECTION));
  const out = [];
  snaps.forEach(d => { if (d.id.startsWith(fieldSlug + "__")) out.push(d.data().value); });
  return out;
};
window.dispatchEvent(new Event('fbReady'));
</script>

/* ============ STATE ============ */
let state = { screen: 'home', field: null, name: null, authKey: null, adminField: null, selectedCandidate: null };

function hashKey(str){
  let h = 5381;
  for (let i=0;i<str.length;i++){ h = ((h<<5)+h) + str.charCodeAt(i); h = h & 0xffffffff; }
  return 'v' + Math.abs(h).toString(36);
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

const FIELD_COLORS = { trade:'var(--f0)', realestate:'var(--f1)', corp:'var(--f2)', inherit:'var(--f3)', capgains:'var(--f4)' };

/* ============ RENDER ============ */
const app = document.getElementById('app');
const pageTitle = document.getElementById('pageTitle');
const pageSub = document.getElementById('pageSub');
const backRow = document.getElementById('backRow');
const backBtn = document.getElementById('backBtn');

backBtn.onclick = () => {
  if(state.screen === 'login'){ state.screen='home'; state.field=null; }
  else if(state.screen === 'vote'){ state.screen='login'; state.name=null; state.authKey=null; state.selectedCandidate=null; }
  else if(state.screen === 'adminLogin'){ state.screen='home'; state.adminField=null; }
  else if(state.screen === 'adminResult'){ state.screen='adminLogin'; }
  render();
};

function render(){
  if(state.screen==='home') renderHome();
  else if(state.screen==='login') renderLogin();
  else if(state.screen==='vote') renderVote();
  else if(state.screen==='done') renderDone();
  else if(state.screen==='adminLogin') renderAdminLogin();
  else if(state.screen==='adminResult') renderAdminResult();
}

function renderHome(){
  backRow.style.display='none';
  pageTitle.textContent = '분야별 우수 발표주제 투표';
  pageSub.textContent = '투표하실 분야를 선택해주세요';
  let html = `
    <div class="hero">
      <div class="hero-badge">
        <div class="hero-logo"><img src="${LOGO_DATA}"></div>
        <div class="hero-org">한국세무사고시회</div>
      </div>
      <div class="hero-title">제4기 세무사 전문분야포럼</div>
      <div class="hero-sub">제2회차 · 분야별 우수 발표주제 투표</div>
      <div class="hero-info">
        <div class="hero-row"><span class="hero-row-label">일자</span><span class="hero-row-val">2026. 9. 10.(목) ~ 9. 12.(토)</span></div>
        <div class="hero-row"><span class="hero-row-label">장소</span><span class="hero-row-val">부산은행 기장연수원</span></div>
        <div class="hero-row"><span class="hero-row-label">주최</span><span class="hero-row-val">한국세무사고시회</span></div>
      </div>
    </div>
  `;
  html += '<div class="field-grid">';
  DATA.fieldOrder.forEach(slug=>{
    const label = DATA.fieldLabels[slug];
    const nVoters = DATA.votersByField[slug].length;
    const nCands = DATA.candidatesByField[slug].length;
    html += `<button class="field-card" onclick="goLogin('${slug}')">
      <span class="field-dot" style="background:${FIELD_COLORS[slug]}"></span>
      <span class="field-main">
        <span class="field-name">${label}</span>
        <span class="field-meta">발표주제 ${nCands}건 · 투표권자 ${nVoters}명 · 세미나실 ${DATA.fieldRoom[slug]}</span>
      </span>
      <span class="field-arrow">›</span>
    </button>`;
  });
  html += '</div>';
  html += '<div class="admin-entry"><button class="admin-link" onclick="goAdminLogin()">분야별 관리자 결과 확인 ›</button></div>';
  app.innerHTML = html;
}

window.goLogin = function(slug){
  state.screen='login'; state.field=slug; render();
};

function renderLogin(){
  backRow.style.display='flex';
  const slug = state.field;
  const label = DATA.fieldLabels[slug];
  pageTitle.textContent = label;
  pageSub.textContent = '로그인 후 투표에 참여해주세요';
  const names = DATA.votersByField[slug];
  let opts = '<option value="">성함을 선택해주세요</option>';
  names.forEach(n=> opts += `<option value="${n}">${n}</option>`);
  app.innerHTML = `
    <div class="auth-card">
      <div class="auth-title">🔐 투표자 로그인</div>
      <div class="auth-desc">${label} 분야의 좌장·고문·스탭·회원만 로그인할 수 있습니다.<br>성함과 비밀번호(4자리=핸드폰 번호 뒷자리)를 입력해주세요.</div>
      <div class="auth-field">
        <label class="auth-label">성함</label>
        <select class="auth-select" id="nameSel">${opts}</select>
      </div>
      <div class="auth-field">
        <label class="auth-label">비밀번호 (4자리)</label>
        <input class="auth-input" id="pwInp" type="password" inputmode="numeric" maxlength="4" placeholder="핸드폰 번호 뒷자리">
      </div>
      <button class="auth-btn" id="loginBtn">로그인하고 투표하기</button>
      <div class="auth-err" id="authErr">성함과 비밀번호가 일치해야 로그인할 수 있습니다.</div>
      <div class="auth-note">타인의 명의로 투표할 수 없습니다. 본인 명의로만 투표해주세요.</div>
    </div>
  `;
  document.getElementById('loginBtn').onclick = () => {
    const name = document.getElementById('nameSel').value;
    const pw = document.getElementById('pwInp').value;
    const errEl = document.getElementById('authErr');
    if(!name || !pw){ errEl.textContent='성함과 비밀번호를 모두 입력해주세요.'; errEl.style.display='block'; return; }
    if(DATA.roster[name] !== pw){ errEl.textContent='성함 또는 비밀번호가 일치하지 않습니다.'; errEl.style.display='block'; return; }
    errEl.style.display='none';
    state.name = name; state.authKey = hashKey(name);
    state.screen='vote'; render();
  };
}

function renderVote(){
  backRow.style.display='flex';
  const slug = state.field;
  const label = DATA.fieldLabels[slug];
  pageTitle.textContent = label;
  pageSub.textContent = `${state.name}님 · 가장 우수하다고 생각하는 발표주제 1건을 선택해주세요`;
  const cands = DATA.candidatesByField[slug];
  let html = '<div class="cand-list">';
  cands.forEach((c,i)=>{
    const sel = state.selectedCandidate === c.name ? 'sel' : '';
    html += `<div class="cand-card ${sel}" onclick="selectCand('${c.name.replace(/'/g,"\\'")}')">
      <img class="cand-photo" src="${c.photo}">
      <div class="cand-main">
        <span class="cand-name">${c.name}</span><span class="cand-gen">${c.gen ? c.gen+'기' : ''}</span>
        <div class="cand-topic">${c.topic || ''}</div>
      </div>
      <div class="cand-check"><svg viewBox="0 0 20 20" fill="none"><path d="M4 10l4 4 8-8" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    </div>`;
  });
  html += '</div>';
  html += `<div style="height:70px"></div>
    <div class="fixed-bar"><button class="btn" id="submitBtn" ${state.selectedCandidate?'':'disabled'}>투표 제출하기</button></div>`;
  app.innerHTML = html;
  document.getElementById('submitBtn').onclick = submitVote;
}

window.selectCand = function(name){
  state.selectedCandidate = name;
  render();
};

async function submitVote(){
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = '제출 중...';
  await waitForFb();
  try{
    const docId = `${state.field}__${state.authKey}`;
    await window.fbSetVote(docId, state.selectedCandidate);
    state.screen='done'; render();
  }catch(e){
    console.error(e);
    toast('제출에 실패했습니다. 다시 시도해주세요.');
    btn.disabled=false; btn.textContent='투표 제출하기';
  }
}

function renderDone(){
  backRow.style.display='none';
  pageTitle.textContent = DATA.fieldLabels[state.field];
  pageSub.textContent = '투표가 완료되었습니다';
  app.innerHTML = `
    <div class="done-wrap">
      <div class="done-icon">✅</div>
      <div class="done-title">투표해주셔서 감사합니다</div>
      <div class="done-desc">${state.name}님의 투표가 정상적으로 접수되었습니다.<br>투표 결과는 공개되지 않으며, 분야별 관리자만 확인할 수 있습니다.</div>
      <button class="done-btn" id="homeBtn">처음 화면으로</button>
    </div>
  `;
  document.getElementById('homeBtn').onclick = () => {
    state = { screen:'home', field:null, name:null, authKey:null, adminField:null, selectedCandidate:null };
    render();
  };
}

/* ============ ADMIN ============ */
function renderAdminLogin(){
  backRow.style.display='flex';
  pageTitle.textContent = '관리자 로그인';
  pageSub.textContent = '분야를 선택하고 관리자 코드를 입력해주세요';
  let opts = '<option value="">분야 선택</option>';
  DATA.fieldOrder.forEach(slug=> opts += `<option value="${slug}">${DATA.fieldLabels[slug]}</option>`);
  opts += `<option value="office">세무사고시회 사무국 (전체 분야 확인)</option>`;
  app.innerHTML = `
    <div class="auth-card">
      <div class="auth-title">🗂 분야별 관리자</div>
      <div class="auth-desc">해당 분야의 관리자 전용 코드를 입력하시면 실시간 투표 순위를 확인할 수 있습니다.</div>
      <div class="auth-field">
        <label class="auth-label">분야</label>
        <select class="auth-select" id="adminFieldSel">${opts}</select>
      </div>
      <div class="auth-field">
        <label class="auth-label">관리자 코드</label>
        <input class="auth-input" id="adminCodeInp" type="password" inputmode="numeric" maxlength="6" placeholder="6자리 코드">
      </div>
      <button class="auth-btn" id="adminLoginBtn">결과 확인하기</button>
      <div class="auth-err" id="adminErr">분야와 코드가 일치해야 확인할 수 있습니다.</div>
    </div>
  `;
  document.getElementById('adminLoginBtn').onclick = () => {
    const slug = document.getElementById('adminFieldSel').value;
    const code = document.getElementById('adminCodeInp').value;
    const errEl = document.getElementById('adminErr');
    if(!slug || !code){ errEl.textContent='분야와 코드를 모두 입력해주세요.'; errEl.style.display='block'; return; }
    if(DATA.adminCodes[slug] !== code){ errEl.textContent='코드가 일치하지 않습니다.'; errEl.style.display='block'; return; }
    errEl.style.display='none';
    state.adminField = slug;
    state.screen='adminResult'; render();
  };
}

window.goAdminLogin = function(){ state.screen='adminLogin'; render(); };

async function renderAdminResult(){
  backRow.style.display='flex';
  const slug = state.adminField;

  if(slug === 'office'){
    pageTitle.textContent = '세무사고시회 사무국 · 전체 분야 결과';
    pageSub.textContent = '집계 중...';
    app.innerHTML = '<div class="spinner"></div>';
    await waitForFb();

    let html = '';
    let totalVotersAll = 0, totalVotesAll = 0;
    for(const fslug of DATA.fieldOrder){
      let votes = [];
      try{ votes = await window.fbGetAllVotesForField(fslug); }catch(e){ console.error(e); }
      const tally = {};
      votes.forEach(name=>{ tally[name] = (tally[name]||0) + 1; });
      const cands = DATA.candidatesByField[fslug];
      const ranked = cands.map(c => ({...c, votes: tally[c.name]||0}))
        .sort((a,b)=> b.votes - a.votes)
        .slice(0,3);
      const totalVoters = DATA.votersByField[fslug].length;
      totalVotersAll += totalVoters; totalVotesAll += votes.length;

      html += `<div class="office-section">
        <div class="office-field-head">
          <span class="field-dot" style="background:${FIELD_COLORS[fslug]}"></span>
          <span class="office-field-name">${DATA.fieldLabels[fslug]}</span>
          <span class="office-field-meta">${votes.length}/${totalVoters}명 참여</span>
        </div>
        <div class="rank-list">`;
      ranked.forEach((c,i)=>{
        const rankCls = i===0?'r1':i===1?'r2':'r3';
        html += `<div class="rank-card ${rankCls}">
          <span class="rank-num">${i+1}</span>
          <img class="rank-photo" src="${c.photo}">
          <div class="rank-main">
            <div class="rank-name">${c.name} <span style="font-weight:600;color:var(--ink-soft);font-size:11.5px;">${c.gen?c.gen+'기':''}</span></div>
            <div class="rank-topic">${c.topic||''}</div>
          </div>
          <div class="rank-votes">${c.votes}표</div>
        </div>`;
      });
      html += `</div></div>`;
    }
    pageSub.textContent = `전체 투표권자 ${totalVotersAll}명 중 ${totalVotesAll}명 참여`;
    html += `<div style="margin-top:6px;text-align:center;"><button class="done-btn" id="refreshBtn">새로고침</button></div>`;
    app.innerHTML = html;
    document.getElementById('refreshBtn').onclick = renderAdminResult;
    return;
  }

  pageTitle.textContent = DATA.fieldLabels[slug] + ' · 실시간 순위';
  pageSub.textContent = '집계 중...';
  app.innerHTML = '<div class="spinner"></div>';
  await waitForFb();
  let votes = [];
  try{ votes = await window.fbGetAllVotesForField(slug); }catch(e){ console.error(e); }

  const tally = {};
  votes.forEach(name=>{ tally[name] = (tally[name]||0) + 1; });

  const cands = DATA.candidatesByField[slug];
  const ranked = cands.map(c => ({...c, votes: tally[c.name]||0}))
    .sort((a,b)=> b.votes - a.votes);

  const totalVoters = DATA.votersByField[slug].length;
  pageSub.textContent = `투표권자 ${totalVoters}명 중 ${votes.length}명 참여`;

  let html = '<div class="rank-list">';
  ranked.forEach((c,i)=>{
    const rankCls = i===0?'r1':i===1?'r2':i===2?'r3':'';
    html += `<div class="rank-card ${rankCls}">
      <span class="rank-num">${i+1}</span>
      <img class="rank-photo" src="${c.photo}">
      <div class="rank-main">
        <div class="rank-name">${c.name} <span style="font-weight:600;color:var(--ink-soft);font-size:11.5px;">${c.gen?c.gen+'기':''}</span></div>
        <div class="rank-topic">${c.topic||''}</div>
      </div>
      <div class="rank-votes">${c.votes}표</div>
    </div>`;
  });
  html += '</div>';
  html += `<div class="rank-summary"><span>전체 투표권자</span><span>${totalVoters}명</span></div>
    <div class="rank-summary"><span>투표 참여</span><span>${votes.length}명 (${totalVoters?Math.round(votes.length/totalVoters*100):0}%)</span></div>
    <div style="margin-top:14px;text-align:center;"><button class="done-btn" id="refreshBtn">새로고침</button></div>`;
  app.innerHTML = html;
  document.getElementById('refreshBtn').onclick = renderAdminResult;
}

render();
</script>
</body>
</html>
